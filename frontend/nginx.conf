server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # File build của Vite có hash trong tên: cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html không cache để lần deploy mới có hiệu lực ngay
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback cho react-router (silent-check-sso.html và file trong public/ được phục vụ nguyên trạng)
    location / {
        try_files $uri $uri/ /index.html;
    }
}