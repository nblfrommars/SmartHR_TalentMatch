spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: smarthr
    password: smarthr123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: false # bật lại khi có db/changelog/db.changelog-master.yaml

  rabbitmq:
    host: localhost
    port: 5673
    username: smarthr
    password: smarthr123

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8180/realms/smarthr}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8180/realms/smarthr/protocol/openid-connect/certs}

keycloak:
  admin:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:smarthr}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:smarthr-admin-service}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:smarthr-admin-secret}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:cv-files}
