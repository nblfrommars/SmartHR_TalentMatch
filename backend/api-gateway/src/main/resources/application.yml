server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://keycloak:8080/realms/smarthr/protocol/openid-connect/certs}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Gateway, smarthr-api-gateway
      routes:
        - id: job-service
          uri: ${JOB_SERVICE_URL:http://job-service:8082}
          predicates:
            - Path=/api/v1/jobs/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
        - id: user-service-users
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/v1/users/**
        - id: user-service-cv
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/v1/cvs/**
        - id: user-service-attachments
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/v1/attachments/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
        - id: user-service-applications
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/v1/applications/**
        - id: user-service-master-data
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/v1/positions/**,/api/v1/skills/**
        - id: job-service-reference-data
          uri: ${JOB_SERVICE_URL:http://job-service:8082}
          predicates:
            - Path=/api/v1/locations/**,/api/v1/industries/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  gateway:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
