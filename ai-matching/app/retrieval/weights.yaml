# Trọng số re-scoring và ngưỡng (ARCHITECTURE.md mục 3.6).
# Giá trị khởi tạo; sẽ tune bằng bộ đánh giá ở Phase 8, không hard-code trong code.
weights:
  hybrid: 0.40
  skill: 0.30
  level: 0.10
  exp: 0.10
  salary: 0.05
  recency: 0.05

# Luật cứng sau re-score
min_skill_score: 0.3     # thiếu hơn 70% skill bắt buộc thì loại
tau: 0.35                # điểm cuối dưới ngưỡng thì không hiển thị
nice_to_have_bonus: 0.1  # cộng thêm theo tỉ lệ skill nice-to-have khớp

# Hybrid search
prefetch_limit: 50       # số ứng viên lấy từ mỗi nhánh dense / sparse
fusion_limit: 50         # số kết quả sau RRF đem đi re-score

# Đa dạng hóa: mỗi công ty tối đa bấy nhiêu job trong danh sách gợi ý
max_per_company: 3

# Độ mới: exp(-ngày / recency_days)
recency_days: 30

# Dự phòng cho CV sơ sài (sinh viên, mới ra trường): ARCHITECTURE.md mục 5, điểm 16.
# CV có ít hơn thin_cv_min_skills skill (tính cả công nghệ trong dự án) mà gợi ý chặt không đủ
# `limit` job thì bù thêm job khớp yếu hơn (vẫn giữ must_have và hard filter), rồi đến job mới
# đăng nhất. Job bù được đánh dấu isFallback, response kèm lời nhắc bổ sung CV.
thin_cv_min_skills: 3
fallback_newest_limit: 20
