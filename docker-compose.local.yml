name: smarthr-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: smarthr
      POSTGRES_PASSWORD: smarthr123
    ports:
      - "5433:5432"
    volumes:
      - smarthr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthr -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: smarthr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: smarthr
      RABBITMQ_DEFAULT_PASS: smarthr123
    ports:
      - "5673:5672" # AMQP
      - "15673:15672" # Management UI: http://localhost:15673
    volumes:
      - smarthr_rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

